services:
  api:
    container_name: nestjs_api_prod
    build:
      context: .
      target: production
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - app-network
    restart: unless-stopped
    # Optional: resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 3s
      retries: 3
    # depends_on:
    #   redis:
    #     condition: service_healthy

networks:
  app-network:
    driver: bridge
