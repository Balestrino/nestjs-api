services:
  api:
    container_name: nestjs_api
    build:
      context: .
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3000:3000'
      # Debug port
      - '9229:9229'
    command: npm run start:dev
    environment:
      - NODE_ENV=development
    # Add depends_on if you have a database
    # depends_on:
    #   - postgres
